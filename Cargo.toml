[package]
name = "L1-bmp-analyzer"
version = "0.1.0"
edition = "2024"

[dependencies]
askama = "0.14.0"
axum = { version = "0.8.6", features = ["multipart"] }
image = { version = "0.25.8", features = ["default-formats"] }
imageproc = "0.25.0"
tokio = { version = "1.47.1", features = ["full"] }
tower-http = {version = "0.6.6", features = ["fs"]}

